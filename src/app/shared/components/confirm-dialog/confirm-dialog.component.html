<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [showHeader]="false"
  [closable]="false"
  [dismissableMask]="false"
  [style]="{ width: '420px' }"
  styleClass="to-confirm-dialog"
>
  <div class="to-confirm-dialog__body">
    @if (variant() === 'danger') {
      <div class="to-confirm-dialog__icon">
        <tabler-icon [icon]="warningIcon" [size]="20" />
      </div>
    }
    <h2 class="to-confirm-dialog__title" [class.to-confirm-dialog__title--danger]="variant() === 'danger'">
      {{ title() }}
    </h2>
    <p class="to-confirm-dialog__message">{{ message() }}</p>
    @if (details().length > 0) {
      <ul class="to-confirm-dialog__details">
        @for (detail of details(); track $index) {
          <li class="to-confirm-dialog__detail">
            <span class="to-confirm-dialog__detail-label">{{ detail.label }}</span>
            @if (detail.value) {
              <span class="to-confirm-dialog__detail-value to-numeric">{{ detail.value }}</span>
            }
          </li>
        }
      </ul>
    }
    @if (note()) {
      <p class="to-confirm-dialog__note">
        <tabler-icon [icon]="warningIcon" [size]="14" aria-hidden="true" />
        <span>{{ note() }}</span>
      </p>
    }
  </div>
  <div class="to-confirm-dialog__actions">
    <button type="button" pButton [text]="true" severity="secondary" (click)="onCancel()">
      {{ cancelLabel() }}
    </button>
    <button
      type="button"
      pButton
      [severity]="variant() === 'danger' ? 'danger' : 'primary'"
      (click)="onConfirm()"
    >
      {{ confirmLabel() }}
    </button>
  </div>
</p-dialog>
