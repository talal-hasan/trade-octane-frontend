@if (useMocks) {
  <div class="to-role-switcher">
    @if (expanded()) {
      <div class="to-role-switcher__panel">
        <div class="to-role-switcher__header">
          <div class="to-role-switcher__header-text">
            <span class="to-role-switcher__title">Switch role</span>
            <span class="to-role-switcher__subtitle">Dev panel — mock auth only</span>
          </div>
          <button type="button" class="to-role-switcher__close" (click)="toggle()" aria-label="Close">
            <tabler-icon [icon]="icons['x']" [size]="16" />
          </button>
        </div>
        <ul class="to-role-switcher__list">
          @for (role of authService.availableRoles; track role) {
            <li>
              <button
                type="button"
                class="to-role-switcher__item"
                [class.to-role-switcher__item--active]="authService.activeRole() === role"
                (click)="switchTo(role)"
              >
                <span class="to-role-switcher__item-avatar">{{ roleLabels[role].slice(0, 2) }}</span>
                <span class="to-role-switcher__item-label">{{ roleLabels[role] }}</span>
                @if (authService.activeRole() === role) {
                  <tabler-icon [icon]="icons['check']" [size]="16" class="to-role-switcher__item-check" />
                }
              </button>
            </li>
          }
        </ul>
      </div>
    }
    <button
      type="button"
      class="to-role-switcher__fab"
      [class.to-role-switcher__fab--expanded]="expanded()"
      pButton
      [rounded]="true"
      (click)="toggle()"
    >
      <tabler-icon [icon]="icons['user']" [size]="18" />
      <span class="to-role-switcher__fab-label">
        {{ authService.activeRole() ? roleLabels[authService.activeRole()!] : 'No role' }}
      </span>
      <tabler-icon [icon]="icons['chevron-right']" [size]="14" class="to-role-switcher__fab-chevron" />
    </button>
  </div>
}
